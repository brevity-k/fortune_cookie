name: Auto Bluesky Post

on:
  schedule:
    - cron: "0 8 * * *"  # Daily at 8AM UTC — fortune post
    - cron: "0 14 * * *" # Daily at 2PM UTC — horoscope post
  workflow_dispatch:
    inputs:
      type:
        description: "Post type"
        type: choice
        options: [fortune, horoscope, both]
        default: both

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-bluesky-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Determine post type
        id: mode
        env:
          INPUT_TYPE: ${{ github.event.inputs.type }}
        run: |
          if [ -n "$INPUT_TYPE" ]; then
            echo "type=$INPUT_TYPE" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "08" ]; then
              echo "type=fortune" >> "$GITHUB_OUTPUT"
            else
              echo "type=horoscope" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Post to Bluesky
        id: bsky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          POST_TYPE: ${{ steps.mode.outputs.type }}
        run: npx tsx scripts/post-to-bluesky.ts --"$POST_TYPE"

      - name: Commit post state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/bsky-post-state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update bluesky post state"
          git pull --rebase origin main
          git push
        continue-on-error: true


  notify-failure:
    needs: post
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = '🚨 Auto Bluesky post pipeline failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated',
              per_page: 10
            });
            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `Workflow run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['bug', 'automated']
              });
            } else {
              console.log('Open issue for auto Bluesky post failure already exists — skipping duplicate.');
            }

  notify-success:
    needs: post
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = '🚨 Auto Bluesky post pipeline failed';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated',
              per_page: 10
            });
            for (const issue of issues.data) {
              if (issue.title === title) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `✅ Pipeline recovered. Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
                });
              }
            }
